<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Case Opener</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #12131c;
      --card-bg: #1c1d2a;
      --accent-color: #5865f2;
      --text-muted: #8e9297;
      --green-color: #48bb78;
      --red-color: #ff4757;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-color);
    }

    .user-info { font-size: 20px; font-weight: bold; }

    .balance-badge {
      background: rgba(30, 41, 59, 0.8);
      color: var(--green-color);
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: bold;
      border: 1px solid rgba(72, 187, 120, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-content { display: none; padding: 20px; flex-direction: column; align-items: center; }
    .tab-content.active { display: flex; }

    .page-title { margin-top: 10px; margin-bottom: 25px; font-size: 16px; font-weight: 600; text-align: center; }

    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }

    .case-card {
      background: var(--card-bg);
      border: 1px solid #2a2b3d;
      border-radius: 16px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }

    .case-card:active { transform: scale(0.96); }
    .case-card:hover { border-color: var(--accent-color); }
    
    .case-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
    }
    
    .case-title { font-weight: bold; font-size: 15px; }
    .case-price { color: var(--green-color); font-weight: bold; font-size: 13px; }

    .roulette-screen {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .btn-back {
      align-self: flex-start;
      background: #1c1d2a;
      border: 1px solid #2a2b3d;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-back:active { transform: scale(0.95); background: #252738; }

    .roulette-wrapper {
      position: relative;
      width: 100%;
      height: 130px;
      border: 2px solid #33334d;
      border-radius: 16px;
      overflow: hidden;
      background: #0b0c12;
      margin-bottom: 20px;
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: var(--red-color);
      z-index: 10;
      box-shadow: 0 0 10px var(--red-color);
    }

    .roulette-tape {
      display: flex;
      position: absolute;
      left: 0;
      top: 15px;
      transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
    }

    .item-card {
      width: 90px;
      height: 100px;
      margin: 0 5px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      flex-shrink: 0;
      box-sizing: border-box;
      text-align: center;
      padding: 5px;
      cursor: pointer;
    }

    .item-img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      margin-bottom: 4px;
    }

    .item-price-tag { font-size: 10px; opacity: 0.85; }

    .common { background: #2d3748; border: 2px solid #4a5568; }
    .rare { background: #1a365d; border: 2px solid #2b6cb0; }
    .epic { background: #44337a; border: 2px solid #6b46c1; }
    .legendary { background: #7b341e; border: 2px solid #c05621; }

    .btn-spin {
      width: 100%;
      padding: 18px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: var(--accent-color);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
    }

    .btn-spin:disabled { background: #3f425a; opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .result-container {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    #result-text { font-weight: bold; font-size: 16px; text-align: center; min-height: 24px; }

    .btn-sell-quick {
      background: rgba(72, 187, 120, 0.2);
      border: 1px solid var(--green-color);
      color: var(--green-color);
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    .inventory-empty { color: var(--text-muted); text-align: center; grid-column: 1 / -1; margin-top: 40px; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid #2a2b3d;
      border-radius: 20px;
      padding: 25px;
      width: 85%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-item-preview {
      width: 110px;
      height: 110px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
    }

    .modal-actions { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
    .btn-modal {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-modal-sell { background: var(--green-color); color: #fff; }
    .btn-modal-close { background: #3a3d54; color: #fff; }

    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: #161722;
      border-top: 1px solid #2a2b3d;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      width: 50%;
    }

    .nav-item.active { color: var(--accent-color); font-weight: bold; }
    .is-disabled { pointer-events: none !important; opacity: 0.4 !important; }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-info" id="username">Игрок</div>
    <div class="balance-badge">
      <span id="balance">1000</span> 💰
    </div>
  </div>

  <div id="tab-shop" class="tab-content active">
    <div class="page-title">Выберите кейс</div>
    
    <div class="cases-grid">
      <div class="case-card" onclick="openSpinScreen('Стандартный', 100)">
        <img src="/images/case_standart/case_standart.png" class="case-img" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/679/679821.png';">
        <div class="case-title">Стандартный</div>
        <div class="case-price">100 💰</div>
      </div>
    </div>
  </div>

  <div id="tab-spin" class="tab-content">
    <div class="roulette-screen">
      <button class="btn-back" id="backBtn" onclick="backToShop()">
        <span>←</span> Назад к кейсам
      </button>

      <div class="roulette-wrapper">
        <div class="pointer"></div>
        <div class="roulette-tape" id="tape"></div>
      </div>

      <button id="openBtn" class="btn-spin" onclick="openCase()">Открыть кейс (100 💰)</button>
      
      <div class="result-container">
        <div id="result-text"></div>
        <button id="quickSellBtn" class="btn-sell-quick" onclick="sellLatestItem()">Продать предмет</button>
      </div>
    </div>
  </div>

  <div id="tab-inventory" class="tab-content">
    <div class="page-title">Мой инвентарь</div>
    <div class="inventory-grid" id="inventory-list">
      <div class="inventory-empty">Пока нет выпавших предметов</div>
    </div>
  </div>

  <div class="modal-overlay" id="itemModal">
    <div class="modal-card">
      <h3 id="modalTitle">Предмет</h3>
      <div class="modal-item-preview" id="modalPreview"></div>
      <div id="modalPrice" style="color: var(--green-color); font-weight: bold;"></div>
      
      <div class="modal-actions">
        <button class="btn-modal btn-modal-sell" onclick="sellSelectedItem()">Продать</button>
        <button class="btn-modal btn-modal-close" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active" id="nav-shop" onclick="switchTab('shop')">
      <span style="font-size: 20px;">📦</span>
      <span>Кейсы</span>
    </div>
    <div class="nav-item" id="nav-inventory" onclick="switchTab('inventory')">
      <span style="font-size: 20px;">🎒</span>
      <span>Инвентарь</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.initDataUnsafe?.user?.first_name) {
      document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
    }

    // Web Audio API Звуковой движок
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Звук щелчка (тиканье)
    function playClickSound() {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.03);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    // Победный звук при остановке
    function playWinSound() {
      if (!audioCtx) return;

      const notes = [523.25, 659.25, 783.99, 1046.50]; // Аккорд C-E-G-C
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.3);
      });
    }

    const casePool = [
      { name: 'Плюшевый Пепе', rarity: 'epic', price: 260, icon: '/images/case_standart/item1.png' },
      { name: 'Злой Глаз', rarity: 'common', price: 25, icon: '/images/case_standart/item2.png' },
      { name: 'Снуп Дог', rarity: 'legendary', price: 800, icon: '/images/case_standart/item3.png' },
      { name: 'Медведь Террорист', rarity: 'epic', price: 200, icon: '/images/case_standart/item4.png' },
      { name: 'Шляпа Честера', rarity: 'rare', price: 110, icon: '/images/case_standart/item5.png' },
      { name: 'Шляпа', rarity: 'rare', price: 140, icon: '/images/case_standart/item6.png' },
      { name: 'Золотые Часы', rarity: 'epic', price: 260, icon: '/images/case_standart/item7.png' },
      { name: 'Лепесток Сакуры', rarity: 'epic', price: 380, icon: '/images/case_standart/item8.png' },
      { name: 'Надувной Фламинго', rarity: 'rare', price: 80, icon: '/images/case_standart/item9.png' }
    ];

    let balance = 1000;
    let currentCase = { name: 'Стандартный', price: 100 };
    let inventory = [];
    let isSpinning = false;
    let lastWonItemIndex = null;
    let selectedInventoryIndex = null;
    let spinSoundInterval = null;

    const tape = document.getElementById('tape');
    const openBtn = document.getElementById('openBtn');
    const backBtn = document.getElementById('backBtn');
    const resultText = document.getElementById('result-text');
    const balanceSpan = document.getElementById('balance');
    const quickSellBtn = document.getElementById('quickSellBtn');

    function updateBalanceUI() {
      balanceSpan.innerText = balance;
    }

    function getItemHTML(item) {
      const fallback = `https://via.placeholder.com/40/000000/FFFFFF?text=${encodeURIComponent(item.name[0])}`;
      return `
        <img src="${item.icon}" class="item-img" onerror="this.onerror=null; this.src='${fallback}';">
        <div>${item.name}</div>
        <div class="item-price-tag">${item.price} 💰</div>
      `;
    }

    function switchTab(tabName) {
      if (isSpinning) return;

      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tabName === 'shop') {
        document.getElementById('tab-shop').classList.add('active');
        document.getElementById('nav-shop').classList.add('active');
      } else if (tabName === 'inventory') {
        document.getElementById('tab-inventory').classList.add('active');
        document.getElementById('nav-inventory').classList.add('active');
        renderInventory();
      }
    }

    function openSpinScreen(name, price) {
      if (isSpinning) return;
      currentCase = { name, price };
      
      openBtn.innerText = `Открыть кейс (${price} 💰)`;
      resultText.innerText = '';
      quickSellBtn.style.display = 'none';
      
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-spin').classList.add('active');

      generateTape(casePool[0]);
    }

    function backToShop() {
      if (isSpinning) return;
      switchTab('shop');
    }

    function generateTape(winningItem) {
      tape.innerHTML = '';
      tape.style.transition = 'none';
      tape.style.transform = 'translateX(0px)';

      for (let i = 0; i < 50; i++) {
        let item = casePool[Math.floor(Math.random() * casePool.length)];
        if (i === 44) item = winningItem;

        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerHTML = getItemHTML(item);
        tape.appendChild(card);
      }
    }

    function setLockState(locked) {
      isSpinning = locked;
      openBtn.disabled = locked;
      backBtn.classList.toggle('is-disabled', locked);
      document.getElementById('nav-shop').classList.toggle('is-disabled', locked);
      document.getElementById('nav-inventory').classList.toggle('is-disabled', locked);
    }

    // Симуляция звука вращения с замедлением
    function startSpinAudio() {
      let currentPos = 0;
      let lastCardIndex = 0;
      const startTime = Date.now();
      const duration = 5000;

      spinSoundInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        if (elapsed >= duration) {
          clearInterval(spinSoundInterval);
          return;
        }

        // Вычисляем текущее смещение ленты по кубической кривой (Cubic-Bezier)
        const progress = elapsed / duration;
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const cardWidth = 100; // Ширина 90px + margin 10px
        
        const estPosition = easeOut * 4250;
        const currentCardIndex = Math.floor(estPosition / cardWidth);

        if (currentCardIndex > lastCardIndex) {
          playClickSound();
          
          // Вибрация в Telegram при прохождении карточки (Haptic Feedback)
          if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
          }
          
          lastCardIndex = currentCardIndex;
        }
      }, 20);
    }

    function openCase() {
      initAudio(); // Инициализация звука по клику

      if (balance < currentCase.price) {
        resultText.innerText = 'Недостаточно средств!';
        return;
      }

      setLockState(true);
      quickSellBtn.style.display = 'none';
      resultText.innerText = '';
      
      balance -= currentCase.price;
      updateBalanceUI();

      const rand = Math.random() * 100;
      let winningItem;

      if (rand < 55) {
        winningItem = casePool[Math.floor(Math.random() * 3)];
      } else if (rand < 85) {
        winningItem = casePool[3 + Math.floor(Math.random() * 3)];
      } else if (rand < 97) {
        winningItem = casePool[6 + Math.floor(Math.random() * 2)];
      } else {
        winningItem = casePool[8];
      }

      generateTape(winningItem);
      tape.offsetHeight;

      const targetIndex = 44;
      const randomOffset = Math.floor(Math.random() * 60) - 30;
      const targetPosition = (targetIndex * 100) - (200 - 50) + randomOffset;

      tape.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.15, 1)';
      tape.style.transform = `translateX(-${targetPosition}px)`;

      // Запускаем звуки тиканья и виброотклик
      startSpinAudio();

      setTimeout(() => {
        const wonItem = { ...winningItem, id: Date.now() };
        inventory.unshift(wonItem);
        lastWonItemIndex = 0;

        playWinSound(); // Праздничный аккорд

        if (tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        resultText.innerText = `Выбито: ${wonItem.name}!`;
        quickSellBtn.innerText = `Продать за ${wonItem.price} 💰`;
        quickSellBtn.style.display = 'block';

        setLockState(false);
      }, 5000);
    }

    function sellLatestItem() {
      if (lastWonItemIndex !== null && inventory.length > 0) {
        const soldItem = inventory.shift();
        balance += soldItem.price;
        updateBalanceUI();

        resultText.innerText = `Продано за +${soldItem.price} 💰`;
        quickSellBtn.style.display = 'none';
        lastWonItemIndex = null;
      }
    }

    function renderInventory() {
      const list = document.getElementById('inventory-list');
      if (inventory.length === 0) {
        list.innerHTML = '<div class="inventory-empty">Пока нет выпавших предметов</div>';
        return;
      }

      list.innerHTML = '';
      inventory.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerHTML = getItemHTML(item);
        card.onclick = () => openModal(index);
        list.appendChild(card);
      });
    }

    function openModal(index) {
      selectedInventoryIndex = index;
      const item = inventory[index];

      document.getElementById('modalTitle').innerText = item.name;
      document.getElementById('modalPrice').innerText = `Цена продажи: ${item.price} 💰`;

      const preview = document.getElementById('modalPreview');
      preview.className = `modal-item-preview ${item.rarity}`;
      preview.innerHTML = getItemHTML(item);

      document.getElementById('itemModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('active');
      selectedInventoryIndex = null;
    }

    function sellSelectedItem() {
      if (selectedInventoryIndex !== null) {
        const item = inventory[selectedInventoryIndex];
        balance += item.price;
        inventory.splice(selectedInventoryIndex, 1);
        
        updateBalanceUI();
        closeModal();
        renderInventory();
      }
    }

    updateBalanceUI();
  </script>
</body>
</html>
