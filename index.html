<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Case Opener</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #12131c;
      --card-bg: #1c1d2a;
      --accent-color: #5865f2;
      --text-muted: #8e9297;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }

    /* Хедер */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-color);
    }

    .user-info { font-size: 20px; font-weight: bold; }

    .balance-badge {
      background: rgba(30, 41, 59, 0.8);
      color: #48bb78;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: bold;
      border: 1px solid rgba(72, 187, 120, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Экран / Вкладка */
    .tab-content { display: none; padding: 20px; flex-direction: column; align-items: center; }
    .tab-content.active { display: flex; }

    .page-title { margin-top: 10px; margin-bottom: 25px; font-size: 16px; font-weight: 600; text-align: center; }

    /* Сетка кейсов */
    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }

    .case-card {
      background: var(--card-bg);
      border: 1px solid #2a2b3d;
      border-radius: 16px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }

    .case-card:active { transform: scale(0.96); }
    .case-card:hover { border-color: var(--accent-color); }
    .case-icon-emoji { font-size: 42px; }
    .case-title { font-weight: bold; font-size: 15px; }
    .case-price { color: #48bb78; font-weight: bold; font-size: 13px; }

    /* Экран рулетки */
    .roulette-screen {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .btn-back {
      align-self: flex-start;
      background: #1c1d2a;
      border: 1px solid #2a2b3d;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-back:active {
      transform: scale(0.95);
      background: #252738;
    }

    .roulette-wrapper {
      position: relative;
      width: 100%;
      height: 130px;
      border: 2px solid #33334d;
      border-radius: 16px;
      overflow: hidden;
      background: #0b0c12;
      margin-bottom: 30px;
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: #ff4757;
      z-index: 10;
      box-shadow: 0 0 10px #ff4757;
    }

    .roulette-tape {
      display: flex;
      position: absolute;
      left: 0;
      top: 15px;
      transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
    }

    .item-card {
      width: 90px;
      height: 100px;
      margin: 0 5px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
      box-sizing: border-box;
      text-align: center;
    }

    .common { background: #2d3748; border: 2px solid #4a5568; }
    .rare { background: #1a365d; border: 2px solid #2b6cb0; }
    .epic { background: #44337a; border: 2px solid #6b46c1; }
    .legendary { background: #7b341e; border: 2px solid #c05621; }

    .btn-spin {
      width: 100%;
      padding: 18px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: var(--accent-color);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
    }

    .btn-spin:disabled { background: #3f425a; opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    #result-text { margin-top: 20px; font-weight: bold; font-size: 16px; height: 24px; text-align: center; }

    /* Инвентарь */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    .inventory-empty { color: var(--text-muted); text-align: center; grid-column: 1 / -1; margin-top: 40px; }

    /* Нижнее меню */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #161722;
      border-top: 1px solid #2a2b3d;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      width: 50%;
    }

    .nav-item.active { color: var(--accent-color); font-weight: bold; }
    .is-disabled { pointer-events: none !important; opacity: 0.4 !important; }
  </style>
</head>
<body>

  <!-- Хедер -->
  <div class="header">
    <div class="user-info" id="username">Игрок</div>
    <div class="balance-badge">
      <span id="balance">...</span> 💰
    </div>
  </div>

  <!-- Вкладка 1: Выбор кейсов (Главный экран) -->
  <div id="tab-shop" class="tab-content active">
    <div class="page-title">Выберите кейс</div>
    
    <div class="cases-grid">
      <div class="case-card" onclick="openSpinScreen('Стандартный', 100)">
        <div class="case-icon-emoji">📦</div>
        <div class="case-title">Стандартный</div>
        <div class="case-price">100 💰</div>
      </div>
      <div class="case-card" onclick="openSpinScreen('Премиум', 250)">
        <div class="case-icon-emoji">🎁</div>
        <div class="case-title">Премиум</div>
        <div class="case-price">250 💰</div>
      </div>
    </div>
  </div>

  <!-- Экран рулетки -->
  <div id="tab-spin" class="tab-content">
    <div class="roulette-screen">
      <button class="btn-back" id="backBtn" onclick="backToShop()">
        <span>←</span> Назад к кейсам
      </button>

      <div class="roulette-wrapper">
        <div class="pointer"></div>
        <div class="roulette-tape" id="tape"></div>
      </div>

      <button id="openBtn" class="btn-spin" onclick="openCase()">Открыть кейс (100 💰)</button>
      <div id="result-text"></div>
    </div>
  </div>

  <!-- Вкладка 2: Инвентарь -->
  <div id="tab-inventory" class="tab-content">
    <div class="page-title">Мой инвентарь</div>
    <div class="inventory-grid" id="inventory-list">
      <div class="inventory-empty">Пока нет выпавших предметов</div>
    </div>
  </div>

  <!-- Нижнее меню -->
  <div class="nav-bar">
    <div class="nav-item active" id="nav-shop" onclick="switchTab('shop')">
      <span style="font-size: 20px;">📦</span>
      <span>Кейсы</span>
    </div>
    <div class="nav-item" id="nav-inventory" onclick="switchTab('inventory')">
      <span style="font-size: 20px;">🎒</span>
      <span>Инвентарь</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    if (tg.initDataUnsafe?.user?.first_name) {
      document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
    }

    const userId = tg.initDataUnsafe?.user?.id || 123456789;
    
    let currentCase = { name: 'Стандартный', price: 100 };
    let inventory = [];
    let isSpinning = false;

    const tape = document.getElementById('tape');
    const openBtn = document.getElementById('openBtn');
    const backBtn = document.getElementById('backBtn');
    const resultText = document.getElementById('result-text');
    const balanceSpan = document.getElementById('balance');

    function switchTab(tabName) {
      if (isSpinning) return;

      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tabName === 'shop') {
        document.getElementById('tab-shop').classList.add('active');
        document.getElementById('nav-shop').classList.add('active');
      } else if (tabName === 'inventory') {
        document.getElementById('tab-inventory').classList.add('active');
        document.getElementById('nav-inventory').classList.add('active');
        renderInventory();
      }
    }

    function openSpinScreen(name, price) {
      if (isSpinning) return;
      currentCase = { name, price };
      
      openBtn.innerText = `Открыть кейс (${price} 💰)`;
      resultText.innerText = '';
      
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-spin').classList.add('active');

      generateTape({ name: 'Кейс', rarity: 'common' });
    }

    function backToShop() {
      if (isSpinning) return;
      switchTab('shop');
    }

    async function loadBalance() {
      try {
        const res = await fetch('/api/get-balance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: userId })
        });
        const data = await res.json();
        if (data.balance !== undefined) balanceSpan.innerText = data.balance;
      } catch (err) {
        console.error('Ошибка загрузки баланса', err);
      }
    }

    function generateTape(winningItem) {
      tape.innerHTML = '';
      tape.style.transition = 'none';
      tape.style.transform = 'translateX(0px)';

      const dummyItems = [
        { name: 'Ширпотреб', rarity: 'common' },
        { name: 'Редкий', rarity: 'rare' },
        { name: 'Эпический', rarity: 'epic' },
        { name: 'Легенда', rarity: 'legendary' }
      ];

      for (let i = 0; i < 50; i++) {
        let item = dummyItems[Math.floor(Math.random() * dummyItems.length)];
        if (i === 44) item = winningItem;

        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerText = item.name;
        tape.appendChild(card);
      }
    }

    function setLockState(locked) {
      isSpinning = locked;
      openBtn.disabled = locked;

      backBtn.classList.toggle('is-disabled', locked);
      document.getElementById('nav-shop').classList.toggle('is-disabled', locked);
      document.getElementById('nav-inventory').classList.toggle('is-disabled', locked);
    }

    async function openCase() {
      setLockState(true);
      resultText.innerText = '';

      try {
        const res = await fetch('/api/open-case', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: userId, case_price: currentCase.price })
        });

        const data = await res.json();

        if (res.status !== 200) {
          resultText.innerText = data.error;
          setLockState(false);
          return;
        }

        const winningItem = data.item;
        generateTape(winningItem);
        tape.offsetHeight;

        const targetIndex = 44;
        const randomOffset = Math.floor(Math.random() * 60) - 30;
        const targetPosition = (targetIndex * 100) - (200 - 50) + randomOffset;

        tape.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.15, 1)';
        tape.style.transform = `translateX(-${targetPosition}px)`;

        setTimeout(() => {
          resultText.innerText = `Выбито: ${winningItem.name}!`;
          balanceSpan.innerText = data.newBalance;
          inventory.unshift(winningItem);
          setLockState(false);
        }, 5000);

      } catch (err) {
        console.error(err);
        resultText.innerText = 'Ошибка соединения';
        setLockState(false);
      }
    }

    function renderInventory() {
      const list = document.getElementById('inventory-list');
      if (inventory.length === 0) {
        list.innerHTML = '<div class="inventory-empty">Пока нет выпавших предметов</div>';
        return;
      }

      list.innerHTML = '';
      inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerText = item.name;
        list.appendChild(card);
      });
    }

    loadBalance();
  </script>
</body>
</html>
