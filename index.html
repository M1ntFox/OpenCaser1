<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Case Opener</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #12131c;
      --card-bg: #1c1d2a;
      --accent-color: #5865f2;
      --accent-hover: #4752c4;
      --text-muted: #8e9297;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }

    /* Верхняя панель (Хедер) */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid #2a2b3d;
    }

    .user-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }
    .balance-badge {
      background: rgba(72, 187, 120, 0.15);
      color: #48bb78;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      border: 1px solid rgba(72, 187, 120, 0.3);
    }

    /* Секции (Вкладки) */
    .tab-content { display: none; padding: 20px; flex-direction: column; align-items: center; }
    .tab-content.active { display: flex; }

    /* --- Вкладка 1: Магазин кейсов --- */
    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 500px;
    }

    .case-card {
      background: var(--card-bg);
      border: 1px solid #2a2b3d;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .case-card:active { transform: scale(0.96); }
    .case-card:hover { border-color: var(--accent-color); }
    .case-icon { font-size: 48px; }
    .case-title { font-weight: bold; font-size: 16px; }
    .case-price { color: #48bb78; font-weight: bold; font-size: 14px; }

    /* --- Вкладка 2: Рулетка --- */
    .roulette-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 120px;
      border: 2px solid #33334d;
      border-radius: 16px;
      overflow: hidden;
      background: #0b0c12;
      margin: 30px 0;
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: #ff4757;
      z-index: 10;
      box-shadow: 0 0 10px #ff4757;
    }

    .roulette-tape {
      display: flex;
      position: absolute;
      left: 0;
      top: 10px;
      transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
    }

    .item-card {
      width: 90px;
      height: 100px;
      margin: 0 5px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      flex-shrink: 0;
      box-sizing: border-box;
      text-align: center;
      padding: 5px;
    }

    .common { background: #2d3748; border: 2px solid #4a5568; }
    .rare { background: #1a365d; border: 2px solid #2b6cb0; }
    .epic { background: #44337a; border: 2px solid #6b46c1; }
    .legendary { background: #7b341e; border: 2px solid #c05621; }

    .btn-main {
      width: 100%;
      max-width: 300px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: var(--accent-color);
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-main:disabled { background: #3f425a; cursor: not-allowed; }

    #result-text { margin-top: 15px; font-weight: bold; font-size: 16px; height: 20px; }

    /* --- Вкладка 3: Инвентарь --- */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }

    .inventory-empty { color: var(--text-muted); text-align: center; grid-column: 1 / -1; margin-top: 40px; }

    /* Нижее навигационное меню */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: var(--card-bg);
      border-top: 1px solid #2a2b3d;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      width: 33%;
    }

    .nav-item.active { color: var(--accent-color); font-weight: bold; }
    .nav-icon { font-size: 20px; }
  </style>
</head>
<body>

  <!-- Хедер -->
  <div class="header">
    <div class="user-info">
      <span id="username">Игрок</span>
    </div>
    <div class="balance-badge">
      <span id="balance">...</span> 💰
    </div>
  </div>

  <!-- Вкладка 1: Магазин -->
  <div id="tab-shop" class="tab-content active">
    <h3 style="margin-bottom: 20px;">Выберите кейс</h3>
    <div class="cases-grid">
      <div class="case-card" onclick="selectCase('Стандартный', 100)">
        <div class="case-icon">📦</div>
        <div class="case-title">Стандартный</div>
        <div class="case-price">100 💰</div>
      </div>
      <div class="case-card" onclick="selectCase('Премиум', 250)">
        <div class="case-icon">🎁</div>
        <div class="case-title">Премиум</div>
        <div class="case-price">250 💰</div>
      </div>
    </div>
  </div>

  <!-- Вкладка 2: Рулетка -->
  <div id="tab-roulette" class="tab-content">
    <h3 id="selected-case-title">Кейс не выбран</h3>
    
    <div class="roulette-wrapper">
      <div class="pointer"></div>
      <div class="roulette-tape" id="tape"></div>
    </div>

    <button id="openBtn" class="btn-main" onclick="openCase()">Крутить кейс</button>
    <div id="result-text"></div>
  </div>

  <!-- Вкладка 3: Инвентарь -->
  <div id="tab-inventory" class="tab-content">
    <h3 style="margin-bottom: 20px;">Мой инвентарь</h3>
    <div class="inventory-grid" id="inventory-list">
      <div class="inventory-empty">Пока нет выпавших предметов</div>
    </div>
  </div>

  <!-- Нижнее меню -->
  <div class="nav-bar">
    <div class="nav-item active" onclick="switchTab('shop')">
      <span class="nav-icon">🛒</span>
      <span>Кейсы</span>
    </div>
    <div class="nav-item" onclick="switchTab('roulette')">
      <span class="nav-icon">🎰</span>
      <span>Рулетка</span>
    </div>
    <div class="nav-item" onclick="switchTab('inventory')">
      <span class="nav-icon">🎒</span>
      <span>Инвентарь</span>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Берем юзернейм из Telegram, если доступен
    if (tg.initDataUnsafe?.user?.first_name) {
      document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
    }

    const userId = tg.initDataUnsafe?.user?.id || 123456789;
    
    let currentCase = { name: 'Стандартный', price: 100 };
    let inventory = [];

    const tape = document.getElementById('tape');
    const openBtn = document.getElementById('openBtn');
    const resultText = document.getElementById('result-text');
    const balanceSpan = document.getElementById('balance');

    // Переключение вкладок
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tabName === 'shop') {
        document.getElementById('tab-shop').classList.add('active');
        document.querySelectorAll('.nav-item')[0].classList.add('active');
      } else if (tabName === 'roulette') {
        document.getElementById('tab-roulette').classList.add('active');
        document.querySelectorAll('.nav-item')[1].classList.add('active');
      } else if (tabName === 'inventory') {
        document.getElementById('tab-inventory').classList.add('active');
        document.querySelectorAll('.nav-item')[2].classList.add('active');
        renderInventory();
      }
    }

    // Выбор кейса из магазина
    function selectCase(name, price) {
      currentCase = { name, price };
      document.getElementById('selected-case-title').innerText = `Кейс: ${name} (${price} 💰)`;
      switchTab('roulette');
    }

    // Загрузка баланса
    async function loadBalance() {
      try {
        const res = await fetch('/api/get-balance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: userId })
        });
        const data = await res.json();
        if (data.balance !== undefined) balanceSpan.innerText = data.balance;
      } catch (err) {
        console.error('Ошибка загрузки баланса', err);
      }
    }

    function generateTape(winningItem) {
      tape.innerHTML = '';
      tape.style.transition = 'none';
      tape.style.transform = 'translateX(0px)';

      const dummyItems = [
        { name: 'Ширпотреб', rarity: 'common' },
        { name: 'Редкий', rarity: 'rare' },
        { name: 'Эпический', rarity: 'epic' },
        { name: 'Легенда', rarity: 'legendary' }
      ];

      for (let i = 0; i < 50; i++) {
        let item = dummyItems[Math.floor(Math.random() * dummyItems.length)];
        if (i === 44) item = winningItem;

        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerText = item.name;
        tape.appendChild(card);
      }
    }

    async function openCase() {
      openBtn.disabled = true;
      resultText.innerText = '';

      try {
        const res = await fetch('/api/open-case', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegram_id: userId, case_price: currentCase.price })
        });

        const data = await res.json();

        if (res.status !== 200) {
          resultText.innerText = data.error;
          openBtn.disabled = false;
          return;
        }

        const winningItem = data.item;
        generateTape(winningItem);
        tape.offsetHeight;

        const targetIndex = 44;
        const randomOffset = Math.floor(Math.random() * 60) - 30;
        const targetPosition = (targetIndex * 100) - (200 - 50) + randomOffset;

        tape.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.15, 1)';
        tape.style.transform = `translateX(-${targetPosition}px)`;

        setTimeout(() => {
          resultText.innerText = `Выбито: ${winningItem.name}!`;
          balanceSpan.innerText = data.newBalance;
          inventory.unshift(winningItem); // Сохраняем в локальный инвентарь
          openBtn.disabled = false;
        }, 5000);

      } catch (err) {
        console.error(err);
        resultText.innerText = 'Ошибка соединения';
        openBtn.disabled = false;
      }
    }

    // Отрисовка предметов в инвентаре
    function renderInventory() {
      const list = document.getElementById('inventory-list');
      if (inventory.length === 0) {
        list.innerHTML = '<div class="inventory-empty">Инвентарь пуст</div>';
        return;
      }

      list.innerHTML = '';
      inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerText = item.name;
        list.appendChild(card);
      });
    }

    // Старт
    selectCase('Стандартный', 100);
    loadBalance();
  </script>
</body>
</html>
