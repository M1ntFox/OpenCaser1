<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Case Opener</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #12131c;
      --card-bg: #1c1d2a;
      --accent-color: #5865f2;
      --text-muted: #8e9297;
      --green-color: #48bb78;
      --red-color: #ff4757;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--bg-color);
    }

    .user-info { font-size: 20px; font-weight: bold; }

    .balance-badge {
      background: rgba(30, 41, 59, 0.8);
      color: var(--green-color);
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: bold;
      border: 1px solid rgba(72, 187, 120, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-content { display: none; padding: 20px; flex-direction: column; align-items: center; width: 100%; }
    .tab-content.active { display: flex; }

    .page-title { margin-top: 10px; margin-bottom: 25px; font-size: 16px; font-weight: 600; text-align: center; }

    .cases-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }

    .case-card {
      background: var(--card-bg);
      border: 1px solid #2a2b3d;
      border-radius: 16px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }

    .case-card:active { transform: scale(0.96); }
    .case-card:hover { border-color: var(--accent-color); }
    
    .case-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
    }
    
    .case-title { font-weight: bold; font-size: 15px; }
    .case-price { color: var(--green-color); font-weight: bold; font-size: 13px; }

    .roulette-screen {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .btn-back {
      align-self: flex-start;
      background: #1c1d2a;
      border: 1px solid #2a2b3d;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-back:active { transform: scale(0.95); background: #252738; }

    /* УВЕЛИЧЕННАЯ РУЛЕТКА */
    .roulette-wrapper {
      position: relative;
      width: 100%;
      height: 160px;
      border: 2px solid #33334d;
      border-radius: 16px;
      overflow: hidden;
      background: #0b0c12;
      margin-bottom: 20px;
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: var(--red-color);
      z-index: 10;
      box-shadow: 0 0 10px var(--red-color);
    }

    .roulette-tape {
      display: flex;
      position: absolute;
      left: 0;
      top: 15px;
      transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
    }

    /* УВЕЛИЧЕННЫЕ КАРТОЧКИ В РУЛЕТКЕ */
    .item-card {
      width: 110px;
      height: 130px;
      margin: 0 6px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
      box-sizing: border-box;
      text-align: center;
      padding: 8px;
      cursor: pointer;
    }

    .item-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .item-price-tag { font-size: 11px; opacity: 0.85; }

    .common { background: #2d3748; border: 2px solid #4a5568; }
    .rare { background: #1a365d; border: 2px solid #2b6cb0; }
    .epic { background: #44337a; border: 2px solid #6b46c1; }
    .legendary { background: #7b341e; border: 2px solid #c05621; }

    .btn-spin {
      width: 100%;
      padding: 18px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: var(--accent-color);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
    }

    .btn-spin:disabled { background: #3f425a; opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    .result-container {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    #result-text { font-weight: bold; font-size: 16px; text-align: center; min-height: 24px; }

    .btn-sell-quick {
      background: rgba(72, 187, 120, 0.2);
      border: 1px solid var(--green-color);
      color: var(--green-color);
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    .inventory-empty { color: var(--text-muted); text-align: center; grid-column: 1 / -1; margin-top: 40px; }

    /* Таблица лидеров */
    .leaderboard-list {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .leader-item {
      background: var(--card-bg);
      border: 1px solid #2a2b3d;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .leader-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .leader-rank {
      font-weight: bold;
      font-size: 16px;
      color: var(--text-muted);
      width: 24px;
    }

    .leader-rank-1 { color: #f6e05e; }
    .leader-rank-2 { color: #cbd5e0; }
    .leader-rank-3 { color: #ed8936; }

    .leader-name {
      font-weight: 600;
      font-size: 14px;
    }

    .leader-balance {
      color: var(--green-color);
      font-weight: bold;
      font-size: 14px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid #2a2b3d;
      border-radius: 20px;
      padding: 25px;
      width: 85%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* КРУПНОЕ ОКНО ПРЕДМЕТА ПРИ НАЖАТИИ В ИНВЕНТАРЕ */
    .modal-item-preview {
      width: 140px;
      height: 150px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
    }
    
    .modal-item-preview .item-img {
      width: 75px;
      height: 75px;
      margin-bottom: 8px;
    }

    .modal-actions { display: flex; gap: 10px; width: 100%; margin-top: 10px; }
    .btn-modal {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-modal-sell { background: var(--green-color); color: #fff; }
    .btn-modal-close { background: #3a3d54; color: #fff; }

    .nav-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: #161722;
      border-top: 1px solid #2a2b3d;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      width: 33.33%;
    }

    .nav-item.active { color: var(--accent-color); font-weight: bold; }
    .is-disabled { pointer-events: none !important; opacity: 0.4 !important; }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-info" id="username">Игрок</div>
    <div class="balance-badge">
      <span id="balance">1000</span> 💰
    </div>
  </div>

  <div id="tab-shop" class="tab-content active">
    <div class="page-title">Выберите кейс</div>
    
    <div class="cases-grid">
      <div class="case-card" onclick="openSpinScreen('Праздничный', 200)">
        <img src="/images/case_standart/case_standart.png" class="case-img" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/679/679821.png';">
        <div class="case-title">Праздничный</div>
        <div class="case-price">200 💰</div>
      </div>
    </div>
  </div>

  <div id="tab-spin" class="tab-content">
    <div class="roulette-screen">
      <button class="btn-back" id="backBtn" onclick="backToShop()">
        <span>←</span> Назад к кейсам
      </button>

      <div class="roulette-wrapper">
        <div class="pointer"></div>
        <div class="roulette-tape" id="tape"></div>
      </div>

      <button id="openBtn" class="btn-spin" onclick="openCase()">Открыть кейс (200 💰)</button>
      
      <div class="result-container">
        <div id="result-text"></div>
        <button id="quickSellBtn" class="btn-sell-quick" onclick="sellLatestItem()">Продать предмет</button>
      </div>
    </div>
  </div>

  <div id="tab-inventory" class="tab-content">
    <div class="page-title">Мой инвентарь</div>
    <div class="inventory-grid" id="inventory-list">
      <div class="inventory-empty">Пока нет выпавших предметов</div>
    </div>
  </div>

  <!-- Вкладка таблицы лидеров -->
  <div id="tab-leaderboard" class="tab-content">
    <div class="page-title">Топ игроков</div>
    <div class="leaderboard-list" id="leaderboard-list">
      <div class="inventory-empty">Загрузка рейтинга...</div>
    </div>
  </div>

  <div class="modal-overlay" id="itemModal">
    <div class="modal-card">
      <h3 id="modalTitle">Предмет</h3>
      <div class="modal-item-preview" id="modalPreview"></div>
      <div id="modalPrice" style="color: var(--green-color); font-weight: bold;"></div>
      
      <div class="modal-actions">
        <button class="btn-modal btn-modal-sell" onclick="sellSelectedItem()">Продать</button>
        <button class="btn-modal btn-modal-close" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active" id="nav-shop" onclick="switchTab('shop')">
      <span style="font-size: 20px;">📦</span>
      <span>Кейсы</span>
    </div>
    <div class="nav-item" id="nav-inventory" onclick="switchTab('inventory')">
      <span style="font-size: 20px;">🎒</span>
      <span>Инвентарь</span>
    </div>
    <div class="nav-item" id="nav-leaderboard" onclick="switchTab('leaderboard')">
      <span style="font-size: 20px;">🏆</span>
      <span>Топ</span>
    </div>
  </div>

  <script>
    // --- Конфигурация Supabase ---
    const SUPABASE_URL = 'https://jbywybwncekaoawzqury.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_WAL11ngzElD9llZZKnpJ9g_cWMgT1kz';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tg = window.Telegram.WebApp;
    tg.expand();

    let userId = tg.initDataUnsafe?.user?.id 
      ? String(tg.initDataUnsafe.user.id) 
      : 'guest_user';

    let userFirstName = tg.initDataUnsafe?.user?.first_name || 'Игрок';
    if (tg.initDataUnsafe?.user?.first_name) {
      document.getElementById('username').innerText = userFirstName;
    }

    // --- Web Audio API ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.03);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    function playWinSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.3);
      });
    }

    // Звук при продаже предмета
    function playSellSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // Предметы со значениями из скриншота
    const casePool = [
      { name: 'Love Potion', rarity: 'legendary', price: 2075, chance: 0.5, icon: '/images/case_standart/item1.png' },
      { name: 'Evil Eye', rarity: 'epic', price: 925, chance: 2.0, icon: '/images/case_standart/item2.png' },
      { name: 'Witch Hat', rarity: 'epic', price: 725, chance: 5.0, icon: '/images/case_standart/item3.png' },
      { name: 'Holiday Drink', rarity: 'rare', price: 450, chance: 10.0, icon: '/images/case_standart/item4.png' },
      { name: 'Tama Gadget', rarity: 'rare', price: 450, chance: 12.0, icon: '/images/case_standart/item5.png' },
      { name: 'Lunar Snake', rarity: 'rare', price: 350, chance: 15.0, icon: '/images/case_standart/item6.png' },
      { name: 'Lol Pop', rarity: 'common', price: 325, chance: 16.0, icon: '/images/case_standart/item7.png' },
      { name: 'Ring', rarity: 'common', price: 100, chance: 18.5, icon: '/images/case_standart/item8.png' },
      { name: 'Diamond', rarity: 'common', price: 100, chance: 21.0, icon: '/images/case_standart/item9.png' }
    ];

    let balance = 1000;
    let currentCase = { name: 'Праздничный', price: 200 };
    let inventory = [];
    let isSpinning = false;
    let lastWonItemIndex = null;
    let selectedInventoryIndex = null;
    let spinSoundInterval = null;

    const tape = document.getElementById('tape');
    const openBtn = document.getElementById('openBtn');
    const backBtn = document.getElementById('backBtn');
    const resultText = document.getElementById('result-text');
    const balanceSpan = document.getElementById('balance');
    const quickSellBtn = document.getElementById('quickSellBtn');

    async function loadUserData() {
      if (userId === 'guest_user') {
        updateBalanceUI();
        return;
      }

      try {
        let { data, error } = await supabaseClient
          .from('users')
          .select('balance, inventory')
          .eq('user_id', userId)
          .maybeSingle();

        if (error) {
          console.error('Ошибка получения пользователя:', error.message);
          return;
        }

        if (data) {
          balance = data.balance ?? 1000;
          inventory = data.inventory ?? [];
        } else {
          const { error: insertError } = await supabaseClient
            .from('users')
            .insert([{ user_id: userId, balance: 1000, inventory: [], username: userFirstName }]);
            
          if (insertError) console.error('Ошибка создания:', insertError.message);
        }
        updateBalanceUI();
        syncUserData();
      } catch (e) {
        console.error('Сбой сети/клиента Supabase:', e);
      }
    }

    async function syncUserData() {
      if (userId === 'guest_user') return;

      try {
        const { error } = await supabaseClient
          .from('users')
          .upsert({ user_id: userId, balance: balance, inventory: inventory, username: userFirstName }, { onConflict: 'user_id' });
        
        if (error) {
          console.error('Ошибка сохранения в Supabase:', error.message);
        }
      } catch (e) {
        console.error('Сбой отправки данных:', e);
      }
    }

    async function loadLeaderboard() {
      const listContainer = document.getElementById('leaderboard-list');
      listContainer.innerHTML = '<div class="inventory-empty">Загрузка рейтинга...</div>';

      try {
        let { data, error } = await supabaseClient
          .from('users')
          .select('username, balance')
          .order('balance', { ascending: false })
          .limit(10);

        if (error) {
          console.error('Ошибка загрузки топа:', error.message);
          listContainer.innerHTML = '<div class="inventory-empty">Ошибка загрузки рейтинга</div>';
          return;
        }

        if (!data || data.length === 0) {
          listContainer.innerHTML = '<div class="inventory-empty">Список лидеров пуст</div>';
          return;
        }

        listContainer.innerHTML = '';
        data.forEach((user, index) => {
          const rank = index + 1;
          let rankClass = '';
          if (rank === 1) rankClass = 'leader-rank-1';
          else if (rank === 2) rankClass = 'leader-rank-2';
          else if (rank === 3) rankClass = 'leader-rank-3';

          const item = document.createElement('div');
          item.className = 'leader-item';
          item.innerHTML = `
            <div class="leader-info">
              <div class="leader-rank ${rankClass}">#${rank}</div>
              <div class="leader-name">${user.username || 'Игрок'}</div>
            </div>
            <div class="leader-balance">${user.balance} 💰</div>
          `;
          listContainer.appendChild(item);
        });
      } catch (e) {
        console.error('Сбой при запросе топа:', e);
        listContainer.innerHTML = '<div class="inventory-empty">Ошибка соединения</div>';
      }
    }

    function updateBalanceUI() {
      balanceSpan.innerText = balance;
    }

    function getItemHTML(item) {
      const fallback = `https://via.placeholder.com/40/000000/FFFFFF?text=${encodeURIComponent(item.name[0])}`;
      return `
        <img src="${item.icon}" class="item-img" onerror="this.onerror=null; this.src='${fallback}';">
        <div>${item.name}</div>
        <div class="item-price-tag">${item.price} 💰</div>
      `;
    }

    function switchTab(tabName) {
      if (isSpinning) return;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tabName === 'shop') {
        document.getElementById('tab-shop').classList.add('active');
        document.getElementById('nav-shop').classList.add('active');
      } else if (tabName === 'inventory') {
        document.getElementById('tab-inventory').classList.add('active');
        document.getElementById('nav-inventory').classList.add('active');
        renderInventory();
      } else if (tabName === 'leaderboard') {
        document.getElementById('tab-leaderboard').classList.add('active');
        document.getElementById('nav-leaderboard').classList.add('active');
        loadLeaderboard();
      }
    }

    function openSpinScreen(name, price) {
      if (isSpinning) return;
      currentCase = { name, price };
      openBtn.innerText = `Открыть кейс (${price} 💰)`;
      resultText.innerText = '';
      quickSellBtn.style.display = 'none';
      
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-spin').classList.add('active');
      generateTape(casePool[0]);
    }

    function backToShop() {
      if (isSpinning) return;
      switchTab('shop');
    }

    function generateTape(winningItem) {
      tape.innerHTML = '';
      tape.style.transition = 'none';
      tape.style.transform = 'translateX(0px)';

      for (let i = 0; i < 50; i++) {
        let item = getRandomItem();
        if (i === 44) item = winningItem;

        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerHTML = getItemHTML(item);
        tape.appendChild(card);
      }
    }

    function getRandomItem() {
      const rand = Math.random() * 100;
      let sum = 0;
      for (const item of casePool) {
        sum += item.chance;
        if (rand <= sum) {
          return item;
        }
      }
      return casePool[casePool.length - 1];
    }

    function setLockState(locked) {
      isSpinning = locked;
      openBtn.disabled = locked;
      backBtn.classList.toggle('is-disabled', locked);
      document.getElementById('nav-shop').classList.toggle('is-disabled', locked);
      document.getElementById('nav-inventory').classList.toggle('is-disabled', locked);
      document.getElementById('nav-leaderboard').classList.toggle('is-disabled', locked);
    }

    function startSpinAudio() {
      let lastCardIndex = 0;
      const startTime = Date.now();
      const duration = 5000;

      spinSoundInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        if (elapsed >= duration) {
          clearInterval(spinSoundInterval);
          return;
        }

        const progress = elapsed / duration;
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const cardWidth = 122; // С учетом ширины карты и отступов
        const estPosition = easeOut * (50 * cardWidth - 200);
        const currentCardIndex = Math.floor(estPosition / cardWidth);

        if (currentCardIndex > lastCardIndex) {
          playClickSound();
          if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
          lastCardIndex = currentCardIndex;
        }
      }, 20);
    }

    function openCase() {
      initAudio();

      if (balance < currentCase.price) {
        resultText.innerText = 'Недостаточно средств!';
        return;
      }

      setLockState(true);
      quickSellBtn.style.display = 'none';
      resultText.innerText = '';
      
      balance -= currentCase.price;
      updateBalanceUI();
      syncUserData();

      const winningItem = getRandomItem();

      generateTape(winningItem);
      tape.offsetHeight;

      const targetIndex = 44;
      const randomOffset = Math.floor(Math.random() * 70) - 35;
      const cardWidth = 122;
      const targetPosition = (targetIndex * cardWidth) - (200 - 55) + randomOffset;

      tape.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.15, 1)';
      tape.style.transform = `translateX(-${targetPosition}px)`;

      startSpinAudio();

      setTimeout(() => {
        const wonItem = { ...winningItem, id: Date.now() };
        inventory.unshift(wonItem);
        lastWonItemIndex = 0;

        playWinSound();
        syncUserData();

        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

        resultText.innerText = `Выбито: ${wonItem.name}!`;
        quickSellBtn.innerText = `Продать за ${wonItem.price} 💰`;
        quickSellBtn.style.display = 'block';

        setLockState(false);
      }, 5000);
    }

    function sellLatestItem() {
      if (lastWonItemIndex !== null && inventory.length > 0) {
        playSellSound();
        const soldItem = inventory.shift();
        balance += soldItem.price;
        updateBalanceUI();
        syncUserData();

        resultText.innerText = `Продано за +${soldItem.price} 💰`;
        quickSellBtn.style.display = 'none';
        lastWonItemIndex = null;
      }
    }

    function renderInventory() {
      const list = document.getElementById('inventory-list');
      if (inventory.length === 0) {
        list.innerHTML = '<div class="inventory-empty">Пока нет выпавших предметов</div>';
        return;
      }

      list.innerHTML = '';
      inventory.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerHTML = getItemHTML(item);
        card.onclick = () => openModal(index);
        list.appendChild(card);
      });
    }

    function openModal(index) {
      selectedInventoryIndex = index;
      const item = inventory[index];

      document.getElementById('modalTitle').innerText = item.name;
      document.getElementById('modalPrice').innerText = `Цена продажи: ${item.price} 💰`;

      const preview = document.getElementById('modalPreview');
      preview.className = `modal-item-preview ${item.rarity}`;
      preview.innerHTML = getItemHTML(item);

      document.getElementById('itemModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('active');
      selectedInventoryIndex = null;
    }

    function sellSelectedItem() {
      if (selectedInventoryIndex !== null) {
        playSellSound();
        const item = inventory[selectedInventoryIndex];
        balance += item.price;
        inventory.splice(selectedInventoryIndex, 1);
        
        updateBalanceUI();
        syncUserData();
        closeModal();
        renderInventory();
      }
    }

    loadUserData();
  </script>
</body>
</html>
