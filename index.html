<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Opening</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Окно рулетки */
    .roulette-wrapper {
      position: relative;
      width: 90%;
      max-width: 400px;
      height: 120px;
      border: 3px solid #33334d;
      border-radius: 12px;
      overflow: hidden;
      background: #0f0f17;
    }

    /* Указатель центра */
    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 100%;
      background: #ff4757;
      z-index: 10;
      box-shadow: 0 0 10px #ff4757;
    }

    /* Лента предметов */
    .roulette-tape {
      display: flex;
      position: absolute;
      left: 0;
      top: 10px;
      transition: transform 5s cubic-bezier(0.15, 0.9, 0.15, 1);
    }

    /* Карточка предмета */
    .item-card {
      width: 90px;
      height: 100px;
      margin: 0 5px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    /* Редкости */
    .common { background: #4a5568; border: 2px solid #718096; }
    .rare { background: #2b6cb0; border: 2px solid #4299e1; }
    .epic { background: #6b46c1; border: 2px solid #9f7aea; }
    .legendary { background: #c05621; border: 2px solid #ed8936; }

    button {
      margin-top: 30px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #3182ce;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      background: #4a5568;
      cursor: not-allowed;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      height: 24px;
    }
  </style>
</head>
<body>

  <h2>Секретный Кейс</h2>

  <div class="roulette-wrapper">
    <div class="pointer"></div>
    <div class="roulette-tape" id="tape"></div>
  </div>

  <button id="openBtn" onclick="openCase()">Открыть за 100 б.</button>
  <div id="result"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем Mini App на весь экран

    const tape = document.getElementById('tape');
    const openBtn = document.getElementById('openBtn');
    const resultDiv = document.getElementById('result');

    const ITEM_WIDTH = 100; // 90px ширина + 10px отступы

    // Генерация декоративных предметов для визуализации рулетки
    function generateTape(winningItem) {
      tape.innerHTML = '';
      tape.style.transition = 'none';
      tape.style.transform = 'translateX(0px)';

      const dummyItems = [
        { name: 'Ширпотреб', rarity: 'common' },
        { name: 'Редкий', rarity: 'rare' },
        { name: 'Эпический', rarity: 'epic' },
        { name: 'Легенда', rarity: 'legendary' }
      ];

      // Генерируем 50 случайных карточек, а на 45-ю позицию ставим выигрыш
      for (let i = 0; i < 50; i++) {
        let item = dummyItems[Math.floor(Math.random() * dummyItems.length)];
        if (i === 44) item = winningItem;

        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.innerText = item.name;
        tape.appendChild(card);
      }
    }

    async function openCase() {
      openBtn.disabled = true;
      resultDiv.innerText = '';

      try {
        // Запрос к серверу за результатом
        const res = await fetch('/api/open-case', { method: 'POST' });
        const data = await res.json();
        const winningItem = data.item;

        // Построение ленты с подставленным выигрышем
        generateTape(winningItem);

        // Принудительный Reflow для применения стилей без анимации
        tape.offsetHeight;

        // Анимация прокрутки к 45-му элементу
        const targetIndex = 44;
        const randomOffset = Math.floor(Math.random() * 60) - 30; // Случайное смещение внутри карточки
        const targetPosition = (targetIndex * ITEM_WIDTH) - (200 - ITEM_WIDTH / 2) + randomOffset;

        tape.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.15, 1)';
        tape.style.transform = `translateX(-${targetPosition}px)`;

        // Показ результата после окончания анимации
        setTimeout(() => {
          resultDiv.innerText = `Вы выиграли: ${winningItem.name}!`;
          openBtn.disabled = false;
        }, 5000);

      } catch (err) {
        console.error(err);
        resultDiv.innerText = 'Ошибка сервера';
        openBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
